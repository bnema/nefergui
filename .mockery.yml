all: false
formatter: goimports
force-file-write: true
structname: '{{.Mock}}{{.InterfaceName}}'
template: testify
template-schema: '{{.Template}}.schema.json'
require-template-schema-exists: true
packages:
  # Unexported GPU seam of Renderer: the mock lives next to the code, in a test file.
  github.com/bnema/nefergui/internal/ui:
    config:
      dir: internal/ui
      pkgname: ui
      filename: '{{.InterfaceName}}_mock_test.go'
    interfaces:
      target:
  # Editor ports: same-package mocks in test files.
  github.com/bnema/nefergui/internal/edit:
    config:
      dir: internal/edit
      pkgname: edit
      filename: '{{.InterfaceName}}_mock_test.go'
    interfaces:
      IME:
        configs:
          - {}
          # Also mocked next to the UI tests that drive the editors.
          - dir: internal/ui
            pkgname: ui
      Clipboard:
        configs:
          - {}
          - dir: internal/ui
            pkgname: ui
      AsyncClipboard:
        configs:
          - dir: internal/ui
            pkgname: ui
