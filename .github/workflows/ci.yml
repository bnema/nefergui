name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Arch matches the development system.
  check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # An init process reaps killed children, as on a real session.
      options: --init
    steps:
      # The tests run without a compositor or a GPU. gcc is for the race
      # detector.
      - run: >-
          pacman -Syu --noconfirm --needed
          git go make gcc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          go install github.com/vektra/mockery/v3@v3.8.0
          go install honnef.co/go/tools/cmd/staticcheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check
      - run: make race
      - run: make mocks-check
      - run: make examples-check
